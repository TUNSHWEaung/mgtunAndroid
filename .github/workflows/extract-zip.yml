
name: Extract Cloud Phone ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          archive = Path("cloud-phone.zip")
          target = Path("cloud-phone")

          if not archive.exists():
              raise SystemExit("cloud-phone.zip not found")

          target.mkdir(exist_ok=True)

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  p = Path(item.filename)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit("Unsafe ZIP path")
              z.extractall(target)

          print("Extraction complete")
          PY

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-phone
          git diff --cached --quiet || git commit -m "Extract cloud-phone ZIP"
          git push
